name: Keepalive

on:
  schedule:
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Keepalive Heartbeat
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .keepalive
          git add .keepalive
          git commit -m 'chore: keepalive heartbeat [skip ci]' || exit 0
          git push
