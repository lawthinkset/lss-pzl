name: Engine Automation

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot (1 to 5)"
        required: false
        default: ""
        type: string
      mode:
        description: "Mode (override or empty for auto)"
        required: false
        default: ""
        type: string
      publish:
        description: "Publish to Facebook (true/false)"
        required: false
        default: "true"
        type: string

  schedule:
    - cron: '14 8,12,16,20,0 * * *'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Puzzle Pipeline
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          CMD="python runner.py"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.slot }}" ]; then
              CMD="$CMD --slot ${{ github.event.inputs.slot }}"
            fi
            if [ -n "${{ github.event.inputs.mode }}" ]; then
              CMD="$CMD --mode ${{ github.event.inputs.mode }}"
            fi
            if [ "${{ github.event.inputs.publish }}" = "true" ]; then
              CMD="$CMD --publish"
            fi
          else
            CMD="$CMD --publish"
          fi
          echo "Executing: $CMD"
          $CMD
