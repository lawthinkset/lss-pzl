name: Engine Automation

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot (1 to 5)"
        required: false
        default: ""
        type: string
      mode:
        description: "Mode (override or empty for auto)"
        required: false
        default: ""
        type: string
      publish:
        description: "Publish to Facebook (true/false)"
        required: false
        default: "true"
        type: string

  schedule:
    - cron: '14 0 * * *'
    - cron: '14 8 * * *'
    - cron: '14 12 * * *'
    - cron: '14 16 * * *'
    - cron: '14 20 * * *'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="15" || true
            sudo apt-get install -y --no-install-recommends ffmpeg || true
          fi
          sudo apt-get install -y --no-install-recommends fonts-liberation fonts-dejavu-core || true

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Puzzle Pipeline
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          CMD="python runner.py"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.slot }}" ]; then
              CMD="$CMD --slot ${{ github.event.inputs.slot }}"
            fi
            if [ -n "${{ github.event.inputs.mode }}" ]; then
              CMD="$CMD --mode ${{ github.event.inputs.mode }}"
            fi
            if [ "${{ github.event.inputs.publish }}" = "true" ]; then
              CMD="$CMD --publish"
            fi
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            CRON_HOUR=$(echo "${{ github.event.schedule }}" | awk '{print $2}')
            case "$CRON_HOUR" in
              "8")  SLOT=1 ;;
              "12") SLOT=2 ;;
              "16") SLOT=3 ;;
              "20") SLOT=4 ;;
              "0")  SLOT=5 ;;
              *)    SLOT="" ;;
            esac
            if [ -n "$SLOT" ]; then
              CMD="$CMD --slot $SLOT"
            fi
            CMD="$CMD --publish"
          else
            CMD="$CMD --publish"
          fi
          echo "Executing: $CMD"
          $CMD
